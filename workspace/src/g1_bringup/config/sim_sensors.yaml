# Sensor sampling inside unitree_mujoco. Read via GROVE_G1_SENSOR_CONFIG; with that
# variable unset the patched binary behaves exactly like the stock one, which is why the
# locomotion suites are unaffected until they opt in.
#
# The simulator loads no ROS and no DDS: unitree_sdk2 already owns the CycloneDDS domain in
# that process. Frames go over the socket below to g1_sensor_relay, which publishes them.
enabled: true

# A full 360x32 sweep costs ~32 ms against the G1 scene (74 geoms, 36 meshes), so this is a
# real budget. It runs on its own thread and never blocks physics or the 1 kHz control path,
# but it still costs a core; the timing gate decides what ships.
rate_hz: 10.0
azimuth_steps: 360
elevation_steps: 32
range_max: 40.0

# The IMU inside the Mid360, sampled on its own thread. 200 Hz because that is what a real
# Mid360 publishes: FAST-LIO's gravity init averages a fixed sample COUNT, so a different rate
# here would average a different span of time than it will on the robot. Its own thread because
# a sweep spends ~32 ms raycasting, and an IMU that stops for 32 ms in every 100 is the gap
# this exists to close.
imu_rate_hz: 200.0

# Also passed to g1_sensor_relay by the launch, so there is one source of truth.
socket_path: "/tmp/g1_sensors.sock"

# Depth camera. Rendered offscreen on its OWN thread against its own snapshot, then
# linearised to metres before it leaves the simulator. Measured 7.9 ms/frame depth-only and
# 11.5 ms with colour, of which only ~0.04 ms holds the sim lock; the rest is the render and
# the socket write, both off-lock.
camera_enabled: true
# Same load as before the camera got its own thread: 10 Hz with colour. 30 Hz depth-only
# (camera_rate_hz: 30.0, camera_rgb: false) is what the object tracker is built for, but it is
# opt-in until it has been shown not to starve the controllers of DDS on the same machine.
camera_rate_hz: 10.0
camera_rgb: true

# Ground-truth poses for the manipulable objects, sampled on the same cycle as the sweep and
# sent ahead of it. SIMULATION ONLY: this is the stand-in for a perception pipeline, and
# g1_object_pose_source refuses to run at all with object_source: hardware.
#
# An explicit list, never every body with a free joint -- the pelvis has one of those too.
# Bodies absent from the staged scene are reported once and skipped, so the flat and
# perception worlds cost nothing here.
object_bodies:
  - red_cube
  - green_cylinder
  - blue_sphere
  - yellow_box
  # Not manipulable, and tracked anyway: g1_base_approach ranges to something on /objects to
  # decide where to stand, and the place leg needs a landmark on the drop-off bench the way the
  # pick leg has the cube itself. Static, so its pose never changes.
  - drop_pad

# SIMULATION ONLY, and a stand-in rather than a model of anything. The RH56E2 fingers carry no
# contact geometry (patch 003, deliberate), so a closed hand passes through an object and
# nothing is ever picked up. This welds the object to the palm once the fingers have measurably
# closed near it, and releases when they open.
#
# NONE OF THESE THREE NUMBERS TRANSFER TO HARDWARE. There the mechanism is friction between
# real finger pads and a real object; these describe the weld, not the RH56E2's grip, and a grasp
# that holds here says nothing about whether the real hand holds it. They sit on the hardware
# re-validation list with the gait deadband and the hand-mass scaling.
#
# Which welds exist is declared in the scene, not here: g1_navigation_scene.xml's `grasp_*`
# equality constraints are found by name.
grasp_weld:
  # The hand now collides (patch 003) and holds objects by friction on its own; this weld is
  # an assist on top. Set false to see what the fingers alone can hold.
  enabled: true

  # Palm origin to object origin. Covers the 0.13 m palm-to-grasp-point offset plus half a small
  # object, chosen rather than measured.
  capture_radius_m: 0.20

  # Mean fraction of available joint travel across the hand's twelve joints (six driven + six
  # mimic). The SRDF's `closed` posture measures 0.71 by this metric and `open` measures 0, so 0.5 sits between them.
  close_fraction: 0.5
  # Deliberately below close_fraction: without the gap a hand resting at the threshold would
  # drop and re-grab the object every few ticks.
  release_fraction: 0.3

# SIMULATION ONLY. Drags any freely-jointed body resting on a `conveyor_belt*` geom along
# that geom's own local +x at a fixed speed, standing in for a real belt's friction drive
# the way grasp_weld stands in for finger contact -- see
# workspace/vendor/unitree_mujoco/conveyor_handler.h for the mechanism.
#
# Only g1_conveyor_scene.xml and its generated variants (g1_conveyor2_scene.xml,
# g1_conveyor_flat_scene.xml) declare a `conveyor_belt` geom, so this
# is a no-op (not even a wasted thread) against every other scene regardless of this `enabled`
# flag.
#
# NONE OF THESE NUMBERS TRANSFER TO HARDWARE. There the belt's own motor and friction do
# this job; these describe the simulated zone, not any real conveyor, and sit on the
# hardware re-validation list alongside grasp_weld's thresholds.
conveyor:
  enabled: true

  # Target speed along the belt's local +x, m/s. Positive only -- a belt that should run the
  # other way is turned around in the scene (its own pose), not given a negative speed here.
  speed_mps: 0.08

  # N per (m/s) of velocity error on the driven body's linear dofs. Large enough to reach
  # speed_mps well inside one capture pass at the small-part masses used here (tens of
  # grams), not tuned against any real belt's drive torque.
  gain: 40.0

  # How far above the belt's own top surface a body's origin may sit and still count as "on"
  # it, in metres. Covers a settling bounce without reaching so high that a part lifted off
  # by the arm is still dragged.
  capture_height_m: 0.09

  # The slotted pallet g1_conveyor_scene.xml carries (written by g1_bringup's
  # tools/make_conveyor_pallet.py; nest clearance, count and load station live there, not
  # here). It indexes one nest at a time: once a panel has sat in the nest at the load station,
  # at rest and touched by no robot geom, for settle_s, the next empty nest is brought to the
  # station; after the last one it runs to the belt's far end and stops. Anything above the
  # pallet is left alone by the belt drag above. No-op in a scene without a pallet.
  pallet:
    enabled: true
    # Peak speed of one index move (min-jerk profile, so it starts and stops smoothly).
    speed_mps: 0.08
    # How long a placed panel must sit still and untouched before the pallet moves on. Long
    # enough that a hand still opening around it is not mistaken for a release.
    settle_s: 1.0
    # Slide-joint drive, N/m and N/(m/s), against the 10 kg pallet: ~20 rad/s, critically
    # damped. Stiff enough that a robot leaning on the pallet barely moves it.
    kp: 4000.0
    kd: 400.0
