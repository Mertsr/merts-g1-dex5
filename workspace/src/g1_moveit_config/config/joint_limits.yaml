    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  right_shoulder_yaw_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  right_elbow_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  right_wrist_roll_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  right_wrist_pitch_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  right_wrist_yaw_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0

  # The simulated Dex5 backend caps every finger at 3.0 rad/s (g1_description's dex5_params.yaml);
  # the drift test keeps these under it. The URDF's own limit is 2.0 rad/s. Acceleration is higher
  # than the arm's because a finger does not move the centre of mass. Left hand only.
  left_thumb_1_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 5.0
  left_thumb_2_joint:
    has_velocity_limits: true
